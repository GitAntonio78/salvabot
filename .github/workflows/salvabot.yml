name: Salvabot - ciclo giornaliero

# CICLO PRINCIPALE: una volta al giorno, dopo la chiusura di Wall Street.
# Analizza tutto il paniere (ETF, crypto, azioni), decide se aprire/cambiare posizioni,
# gestisce le proposte (salvadanaio, nuova posizione) e aggiorna la pagina.
#
# Gli orari sono in UTC e GitHub NON gestisce l'ora legale: per questo ci sono due righe,
# una per i mesi "estivi" (marzo-ottobre) e una per quelli "invernali" (novembre-febbraio).
# Approssimazione a livello di mese: per 1-2 settimane l'anno, a cavallo del cambio ora,
# lo scarto puo' essere di un'ora. Minuti "storti" (:37) per evitare l'orario di punta di GitHub.
on:
  schedule:
    - cron: "37 20 * 3-10 *"       # estate: 22:37 in Italia, ~40 minuti dopo la chiusura di Wall Street
    - cron: "37 21 * 11,12,1,2 *"  # inverno: 22:37 in Italia, ~40 minuti dopo la chiusura di Wall Street
  workflow_dispatch: {}

# Mai due lavori insieme: scrivono gli stessi file di stato, si mettono in coda.
concurrency:
  group: salvabot-stato
  cancel-in-progress: false

jobs:
  ciclo-principale:
    runs-on: ubuntu-latest
    env:
      SALVABOT_SOLO_DATI_REALI: "1"   # mai prezzi inventati: se i dati mancano, il ciclo si ferma
    permissions:
      contents: write
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il ciclo principale di Salvabot
        run: python3 run_ciclo.py --saldo 30

      - name: Genera la pagina web aggiornata
        run: python3 genera_pagina.py

      - name: Salva stato, notifiche e pagina aggiornati nel repository
        run: |
          git config user.name "salvabot-bot"
          git config user.email "salvabot-bot@users.noreply.github.com"
          git add $(ls stato_salvabot.json impostazioni_salvabot.json notifiche_salvabot.json docs/index.html 2>/dev/null)
          git diff --quiet --cached || git commit -m "Ciclo principale del $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
